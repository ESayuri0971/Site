    /* Catalog Shell Overrides */
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
    }

    .catalog-header {
      height: 86px;
      position: relative;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      z-index: 50;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .catalog-inner {
      width: min(1280px, calc(100% - 112px));
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-ds {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -1.5px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
    }

    .brand-ds svg {
      width: 28px;
      height: 28px;
      color: var(--copper);
    }

    .ds-badge {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--copper);
      border: 1px solid var(--line);
      padding: 4px 9px;
      border-radius: 20px;
      margin-left: 6px;
      font-family: var(--font);
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      padding: 4px 6px;
      border-radius: 30px;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      color: var(--muted);
      border: 1px solid transparent;
      background: transparent;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .tab-btn:hover:not(:disabled) {
      color: var(--ink);
    }

    .tab-btn.active {
      background: var(--ink);
      color: #171715;
      border-color: var(--ink);
      box-shadow: inset 0 2px 1px #fff;
    }

    .tab-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: transparent;
    }

    .tab-pending {
      font-size: 9px;
      padding: 2px 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      margin-left: 4px;
      color: var(--muted);
    }

    .phase-badge {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--copper);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .phase-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--copper);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--copper);
    }

    .catalog-main {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }

    #overview-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>

  <script>
    function handleHash() {
      const hash = window.location.hash || '#overview';
      const tabOverview = document.getElementById('tab-overview');
      const tabComponents = document.getElementById('tab-components');

      if (hash === '#components' && !tabComponents.disabled) {
        tabOverview.classList.remove('active');
        tabComponents.classList.add('active');
      } else {
        if (window.location.hash !== '#overview') {
          history.replaceState(null, '', '#overview');
        }
        tabOverview.classList.add('active');
        tabComponents.classList.remove('active');
      }
    }

    window.addEventListener('hashchange', handleHash);
    window.addEventListener('DOMContentLoaded', handleHash);
  </script>
